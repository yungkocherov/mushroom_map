# Production-деплой web на TimeWeb VM (Caddy раздаёт /srv/web).
#
# Тригер: push в main с изменениями в apps/web/** или packages/**.
# Cloudflare Pages выпилен 2026-04-29 (TSPU режет CF SNI из РФ → сайт
# не открывался без VPN). Теперь фронт живёт на той же VM, что и API.
#
# Что делает:
#   1. npm ci + vite build
#   2. rsync apps/web/dist/ → root@$PROD_HOST:/srv/web/  (с --delete)
#
# Caddy (на VM) автоматически подхватывает новые файлы — Vite кладёт
# хеши в имена ассетов, index.html короткоживущий (см. infra/Caddyfile).
#
# Требуемые secrets (Settings → Secrets → Actions):
#   PROD_HOST           — IP или hostname VM (как у deploy-api)
#   PROD_SSH_USER       — root для текущей TimeWeb VM
#   PROD_SSH_KEY        — приватный ключ (содержимое id_ed25519)
#
# Vars (Settings → Variables → Actions):
#   VITE_API_URL        — https://api.geobiom.ru
#   PROD_DEPLOY_ENABLED — 'true' чтобы реально пушить на VM

name: deploy-web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# По одному деплою за раз — параллельные rsync --delete в /srv/web
# могут погонять друг друга (см. аналогичный инцидент deploy-api
# 2026-07-01).
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.PROD_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install workspace deps
        run: npm ci

      - name: Build web
        env:
          # VITE_TILES_URL не задаём — фронт fallback'ит на ${API_ORIGIN}/tiles
          # (см. apps/web/src/components/mapView/utils/api.ts). Тайлы раздаёт
          # Caddy на api-домене из /srv/mushroom-map/tiles.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Observability envs запекаются в bundle при build'е. Если
          # переменные не заданы в GH Variables — SDK инициализируется в
          # no-op режиме (см. apps/web/src/main.tsx).
          VITE_SENTRY_DSN:       ${{ vars.VITE_SENTRY_DSN }}
          VITE_UMAMI_HOST:       ${{ vars.VITE_UMAMI_HOST }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_GIT_SHA:          ${{ github.sha }}
        run: npm -w @mushroom-map/web run build

      - name: Rsync dist to TimeWeb VM
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447  # v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          REMOTE_HOST:     ${{ secrets.PROD_HOST }}
          REMOTE_USER:     ${{ secrets.PROD_SSH_USER }}
          SOURCE:          "apps/web/dist/"
          TARGET:          "/srv/web/"
          ARGS: "-rlgoDz --delete --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"

      # V4.5+ (V4.6): Oracle foreign-IP replica. Через ssh+tar вместо
      # rsync — на Oracle ubuntu user'е ssh-deploy action упорно падает
      # с «protocol version mismatch» (rsync дереву из чего-то в ssh-
      # session-handshake'е). Tar-stream через stdin pipe в `ssh tar
      # -xzf` работает predictable. Один shot, без incremental.
      - name: Tar-stream dist to Oracle VM
        if: ${{ vars.ORACLE_DEPLOY_ENABLED == 'true' }}
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          # Oracle Ubuntu cloud-image — user всегда `ubuntu` (root заблокирован).
          # Hardcoded fallback: если secret пуст / содержит whitespace —
          # используем 'ubuntu'. Раньше fallback'или на `secrets.PROD_SSH_USER`
          # (root для TimeWeb) — Oracle отвечал «login as ubuntu».
          ORACLE_USER: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
          ORACLE_KEY:  ${{ secrets.ORACLE_SSH_KEY || secrets.PROD_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$ORACLE_KEY" > ~/.ssh/oracle_deploy
          chmod 600 ~/.ssh/oracle_deploy
          # tar -czf -  → ssh tar -xzf -  с очисткой каталога.
          # --strip-components не нужен: tar -C apps/web/dist + tar -C /srv/web
          # сохраняет относительные пути from-dist (assets/, index.html, ...).
          # /srv/web/ принадлежит ubuntu:ubuntu после первой manual-sync,
          # но если каталог потом тронули root'ом — нужно sudo. Tee'м
          # tar-команду через `sudo -n` (non-interactive) — на Oracle
          # NOPASSWD должен быть для ubuntu (cloud-init default).
          tar -C apps/web/dist -czf - . | \
            ssh -i ~/.ssh/oracle_deploy \
                -o StrictHostKeyChecking=no \
                "$ORACLE_USER@$ORACLE_HOST" \
                "sudo rm -rf /srv/web/* && sudo tar -C /srv/web -xzf -"
