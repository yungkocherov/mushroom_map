# Production-деплой API. Тригерится:
#   - push в main с изменениями в services/api/** или db/migrations/**
#   - вручную через workflow_dispatch
#
# Что делает:
#   1. Билдит образ из services/api/Dockerfile.prod
#   2. Тегает sha-<short> + latest
#   3. Пушит в ghcr.io/<owner>/mushroom-map-api
#   4. По ssh заходит на VM, pull + restart api контейнера
#
# Требуемые secrets (Settings → Secrets → Actions):
#   PROD_HOST           — IP или hostname VM
#   PROD_SSH_USER       — обычно ubuntu
#   PROD_SSH_KEY        — приватный ключ (содержимое id_ed25519)
#
# GHCR-доступ берётся из дефолтного GITHUB_TOKEN (нужен write:packages
# в job permissions).

name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "db/migrations/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# Деплои строго по одному. Параллельные push'и в main (например серия
# dependabot-мёржей) иначе гонятся за пересоздание контейнера на VM:
# 2026-07-01 три одновременных deploy'а снесли mushroom_api_prod
# (compose «No such container» на переименованном старике + 502 до
# ручного up -d). cancel-in-progress выключен — каждый деплой докатывает
# свой (одинаковый по содержимому api) образ до конца.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build & push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Compute image tag
        id: meta
        run: |
          SHA="${GITHUB_SHA::7}"
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mushroom-map-api"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMG:sha-$SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          # Context = repo root: Dockerfile.prod копирует и services/api/src,
          # и db/ для миграций. См. сам Dockerfile.prod, заголовок.
          context: .
          file: services/api/Dockerfile.prod
          push: true
          # Multi-arch — на Oracle Free Tier ARM64; локальная отладка x86.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-timeweb:
    name: ssh deploy to TimeWeb (primary RU)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.PROD_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: SSH and pull/restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GIT_SHA
          script: |
            set -e
            cd /srv/mushroom-map
            git pull --ff-only origin main
            export GIT_SHA="${GIT_SHA}"
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull api
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d api
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api \
                python /app/db/migrate.py
            docker image prune -f --filter "until=24h"

  # V4.5: Oracle Stockholm — foreign-IP replica. Тот же образ, тот же
  # compose, отдельная DB (sync через geobiom-db-sync.timer на TimeWeb).
  # Включается флагом ORACLE_DEPLOY_ENABLED=true в GH vars; иначе skip.
  # Если SSH key одинаковый — reuse PROD_SSH_KEY; если разные —
  # переопределить ORACLE_SSH_KEY/ORACLE_SSH_USER в secrets.
  deploy-oracle:
    name: ssh deploy to Oracle (foreign replica)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ORACLE_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: SSH and pull/restart
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        env:
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ vars.ORACLE_HOST }}
          # Oracle Ubuntu cloud-image — user всегда `ubuntu` (root blocked).
          username: ${{ secrets.ORACLE_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.ORACLE_SSH_KEY || secrets.PROD_SSH_KEY }}
          envs: GIT_SHA
          script: |
            set -e
            # Oracle compose dir может требовать sudo для git pull
            # (root-owned). docker compose тоже через sudo, т.к. ubuntu-
            # user может быть не в docker-group.
            sudo bash -c '
              cd /srv/mushroom-map
              git pull --ff-only origin main
              export GIT_SHA="'"${GIT_SHA}"'"
              docker compose -f docker-compose.prod.yml --env-file .env.prod pull api
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d api
              docker image prune -f --filter "until=24h"
            '
